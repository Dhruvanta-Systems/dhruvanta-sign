name: Build Docker Images

# Runs on version tags only. The image is built on every tag; it is pushed only
# when the repository variable DOCKER_IMAGE (for example "myorg/myimage") and the
# secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are set.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ vars.DOCKER_IMAGE || 'dhruvanta-sign' }}
        tags: type=semver,pattern={{version}}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .version file
      env:
        REF_NAME: ${{ github.ref_name }}
      run: echo "$REF_NAME" > .version

    - name: Login to Docker Hub
      if: ${{ vars.DOCKER_IMAGE != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ vars.DOCKER_IMAGE != '' }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
